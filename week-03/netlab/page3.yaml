repository: https://github.com/cheonglihua/wic2005-lab-portfolio

answers:
  design:
    question: "Describe your design: why these routers, LANs and links, and how you chose the addresses."
    answer: >-
      I kept the r1–r2–r3 triangle so h1 can reach r2 over a direct link or
      through r3, then extended the network with r4 and h4 over r2–r4. This
      gives four routers and four host LANs while retaining the redundant path
      used to study route selection and failure. The 10.3.0.0/16 block uses /24
      LANs and /30 router links; the /30 links leave two usable addresses, one
      for each endpoint.
  summary:
    question: "Which route summarises several LANs? Which networks does it cover, why is it correct, and what else would it attract if you added a network inside its range?"
    answer: >-
      The 10.3.32.0/20 summary covers h2 (10.3.32.0/24), h3
      (10.3.33.0/24), and h4 (10.3.34.0/24); h1's 10.3.1.0/24 is outside it.
      It also covers unused /24 space from 10.3.35.0 through 10.3.47.0, so a
      future network there would be attracted to this next hop unless a more
      specific route overrides it. For h2, r1 chooses its /24 route over the
      overlapping /20 summary because longest-prefix matching selects the more
      specific prefix.
  failure:
    question: "When you took a link down, what happened, and why couldn't your routes recover even though another path existed? What would have recovered?"
    answer: >-
      With r1–r2 down, r1's lookup for h2 moved to the /20 via r3, but r2 had
      no route back to h1 and returned "Network is unreachable". The h1-to-h2
      ping therefore lost both packets even though the forward path existed.
      After I brought the link up, the connected /30 returned but r2's static
      route to h1 did not; the ping still failed. Re-adding
      10.3.1.0/24 via 10.3.12.1 on r2 restored both the return path and ping.
      OSPF could advertise the alternate path and recalculate after a failure.
  control_plane:
    question: "In your network, what was the control plane? Who worked out the routes, and what does that mean for a network of 40 routers?"
    answer: >-
      I acted as the control plane by designing the static routes in YAML and
      checking that every host pair had a valid path. Linux's kernel then used
      its routing table and longest-prefix match to forward each packet; no
      routing protocol recalculated paths. Keeping routes consistent across 40
      routers by hand would be difficult and error-prone. A protocol such as
      OSPF or validated configuration automation could distribute and update
      routes as the topology changes.
